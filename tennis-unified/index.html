<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=https://tennis-unified.github.io/">
  <link rel="canonical" href="https://tennis-unified.github.io/">
  <title>Tennis Unified Library</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 48px 36px;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      font-size: 40px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 26px;
      margin: 0 0 12px;
      font-weight: 700;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 16px;
      line-height: 1.6;
      margin: 0 0 28px;
    }
    .btn {
      display: inline-block;
      background: #0284c7;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 17px;
      padding: 14px 32px;
      border-radius: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }
    .btn:hover {
      background: #0369a1;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
    }
    .subtext {
      margin-top: 20px;
      font-size: 14px;
      color: #64748b;
    }
    .subtext a {
      color: #38bdf8;
      text-decoration: underline;
    }
  </style>
  <script>
    (function () {
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      window.location.replace('https://tennis-unified.github.io/' + search + hash);
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="badge">🎾</div>
    <h1>Tennis Unified Library</h1>
    <p>Tennis Unified has moved to its official site at <a href="https://tennis-unified.github.io/" style="color:#38bdf8;font-weight:bold;">tennis-unified.github.io</a>.</p>
    <a href="https://tennis-unified.github.io/" class="btn" id="redirect-link">Go to Tennis Unified Library →</a>
    <div class="subtext">
      Redirecting automatically... If nothing happens, <a href="https://tennis-unified.github.io/">click here</a>.
    </div>
  </div>
</body>
</html>

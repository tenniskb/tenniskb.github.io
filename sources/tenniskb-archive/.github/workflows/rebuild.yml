name: Rebuild tenniskb site with real MkDocs build

on:
  push:
    branches: [rebuild-staging]
  workflow_dispatch:
    inputs:
      deploy_live:
        description: "Deploy result to the LIVE gh-pages branch (only run this after reviewing the build artifact)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild-staging (script + mkdocs.yml)
        uses: actions/checkout@v4
        with:
          ref: rebuild-staging
          path: staging

      - name: Checkout live gh-pages (old hand-typed site, to convert + preserve)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: old_site

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install mkdocs-material beautifulsoup4 markdownify

      - name: Convert old HTML pages to Markdown source
        run: |
          cd staging
          python scripts/convert_html_to_md.py ../old_site docs
          echo "----- conversion report -----"
          cat conversion_report.txt

      - name: Build MkDocs site
        run: |
          cd staging
          mkdocs build --site-dir ../new_site

      - name: Assemble final output (overlay new en/ + vi/ + assets onto full old site, everything else untouched)
        run: |
          rm -rf assembled
          cp -r old_site assembled
          rm -rf assembled/.git
          mkdir -p assembled/en assembled/vi assembled/assets
          cp -r new_site/en/. assembled/en/
          cp -r new_site/vi/. assembled/vi/
          cp -r new_site/assets/. assembled/assets/
          echo "----- assembled top level -----"
          ls assembled

      - name: Verify previously-broken pages now have a real sidebar
        run: |
          for f in en/system/index.html en/strokes/index.html en/start-here/index.html en/patterns/index.html en/membership/index.html vi/system/index.html; do
            echo "checking $f"
            grep -q 'md-sidebar--primary' "assembled/$f" && echo "  OK: sidebar present" || (echo "  MISSING sidebar in $f" && exit 1)
          done

      - name: Upload build for review
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-site
          path: assembled
          retention-days: 14

      - name: Deploy to LIVE gh-pages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_live == true }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./assembled
          publish_branch: gh-pages
          keep_files: false

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" width="100%" height="100%">
  <defs>
    <style>
      .racket-frame { fill: none; stroke: #334155; stroke-width: 14; stroke-linejoin: round; }
      .string-line { stroke: #cbd5e1; stroke-width: 1; }
      .spot-circle { fill-opacity: 0.85; stroke-width: 2; }
      .spot-label { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; }
      .spot-desc { font-family: 'DM Sans', sans-serif; font-size: 11px; fill: #475569; }
      .card-bg { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 10; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.05)); }
      @media (prefers-color-scheme: dark) {
        .racket-frame { stroke: #94a3b8; }
        .string-line { stroke: #475569; }
        .card-bg { fill: #1e293b; stroke: #334155; }
        .spot-desc { fill: #cbd5e1; }
      }
    </style>
  </defs>

  <!-- Title -->
  <text x="425" y="38" font-family="'DM Sans', sans-serif" font-size="22" font-weight="800" fill="#047857" text-anchor="middle">
    THE THREE TENNIS RACKET SWEET SPOTS
  </text>
  <text x="425" y="60" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">
    Acoustical Node of Vibration · Center of Percussion (COP) · Maximum Coefficient of Restitution (COR)
  </text>

  <!-- Racket Head Drawing (Oval Center: 240, 280) -->
  <!-- Throat & Handle -->
  <path d="M 200 440 L 220 530 L 260 530 L 280 440" fill="#1e293b" stroke="#0f172a" stroke-width="4" />
  
  <!-- Outer Head -->
  <ellipse cx="240" cy="260" rx="140" ry="170" class="racket-frame" />

  <!-- String Grid (Simplified sample) -->
  <g class="string-line">
    <!-- Verticals -->
    <line x1="160" y1="140" x2="160" y2="380" />
    <line x1="180" y1="110" x2="180" y2="410" />
    <line x1="200" y1="98"  x2="200" y2="422" />
    <line x1="220" y1="92"  x2="220" y2="428" />
    <line x1="240" y1="90"  x2="240" y2="430" />
    <line x1="260" y1="92"  x2="260" y2="428" />
    <line x1="280" y1="98"  x2="280" y2="422" />
    <line x1="300" y1="110" x2="300" y2="410" />
    <line x1="320" y1="140" x2="320" y2="380" />
    <!-- Horizontals -->
    <line x1="130" y1="160" x2="350" y2="160" />
    <line x1="115" y1="190" x2="365" y2="190" />
    <line x1="105" y1="220" x2="375" y2="220" />
    <line x1="102" y1="250" x2="378" y2="250" />
    <line x1="105" y1="280" x2="375" y2="280" />
    <line x1="115" y1="310" x2="365" y2="310" />
    <line x1="130" y1="340" x2="350" y2="340" />
    <line x1="155" y1="370" x2="325" y2="370" />
  </g>

  <!-- SPOT 1: NODE OF VIBRATION (Near Center/Upper Center) -->
  <circle cx="240" cy="225" r="22" fill="#3b82f6" stroke="#1d4ed8" class="spot-circle" />
  <text x="240" y="230" font-family="'DM Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">NODE</text>

  <!-- SPOT 2: CENTER OF PERCUSSION (Geometric Center) -->
  <circle cx="240" cy="275" r="26" fill="#10b981" stroke="#047857" class="spot-circle" />
  <text x="240" y="280" font-family="'DM Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">COP</text>

  <!-- SPOT 3: MAXIMUM COR (Lower, near throat) -->
  <circle cx="240" cy="335" r="24" fill="#f59e0b" stroke="#b45309" class="spot-circle" />
  <text x="240" y="340" font-family="'DM Sans', sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">COR</text>

  <!-- DETAIL CARDS ON RIGHT -->

  <!-- CARD 1: NODE OF VIBRATION -->
  <rect x="440" y="100" width="370" height="95" class="card-bg" />
  <circle cx="465" cy="125" r="10" fill="#3b82f6" />
  <text x="485" y="130" class="spot-label" fill="#1d4ed8">1. Node of Vibration (The "No Buzz" Spot)</text>
  <text x="465" y="152" class="spot-desc">• Impacting here excites zero fundamental bending frequency (~130–150 Hz).</text>
  <text x="465" y="170" class="spot-desc">• Feels the smoothest to the hand; prevents stinging in cold weather.</text>
  <line x1="262" y1="225" x2="440" y2="145" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4" />

  <!-- CARD 2: CENTER OF PERCUSSION (COP) -->
  <rect x="440" y="220" width="370" height="105" class="card-bg" />
  <circle cx="465" cy="245" r="10" fill="#10b981" />
  <text x="485" y="250" class="spot-label" fill="#047857">2. Center of Percussion (The "No Shock" Spot)</text>
  <text x="465" y="272" class="spot-desc">• The true mechanical sweet spot where linear impact force and rotational</text>
  <text x="465" y="290" class="spot-desc">  recoil cancel each other out completely at the hand.</text>
  <text x="465" y="308" class="spot-desc">• Produces ZERO initial jarring shock to the wrist and elbow joints.</text>
  <line x1="266" y1="275" x2="440" y2="265" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />

  <!-- CARD 3: MAXIMUM COEFFICIENT OF RESTITUTION (COR) -->
  <rect x="440" y="350" width="370" height="105" class="card-bg" />
  <circle cx="465" cy="375" r="10" fill="#f59e0b" />
  <text x="485" y="380" class="spot-label" fill="#b45309">3. Maximum COR (The "Max Power" Spot)</text>
  <text x="465" y="402" class="spot-desc">• Located closer to the throat where the frame is stiffer.</text>
  <text x="465" y="420" class="spot-desc">• Rebounds with highest trampoline velocity, but transfers greater shock.</text>
  <text x="465" y="438" class="spot-desc">• Modern pros drop the ball slightly lower on flat serves to tap max power.</text>
  <line x1="264" y1="335" x2="440" y2="395" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" />

  <!-- FOOTER INSIGHT -->
  <rect x="40" y="480" width="770" height="45" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="425" y="508" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">
    Engineering Summary: The "Sweet Spot" is not a single point, but an optimized spatial zone spanning COP, Node, and COR.
  </text>
</svg>

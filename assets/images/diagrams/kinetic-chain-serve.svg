<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <style>
      .stage-box { fill: #ffffff; stroke: #059669; stroke-width: 2.5; rx: 10; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06)); }
      .stage-title { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 800; fill: #065f46; text-anchor: middle; }
      .stage-sub { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; fill: #475569; text-anchor: middle; }
      .stage-num { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
      .arrow { stroke: #059669; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .energy-pct { font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 700; fill: #dc2626; text-anchor: middle; }
      @media (prefers-color-scheme: dark) {
        .stage-box { fill: #1e293b; stroke: #10b981; }
        .stage-title { fill: #34d399; }
        .stage-sub { fill: #cbd5e1; }
      }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#059669" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="475" y="35" font-family="'DM Sans', sans-serif" font-size="22" font-weight="800" fill="#047857" text-anchor="middle">
    THE 8-STAGE SERVE KINETIC CHAIN (PROXIMAL TO DISTAL)
  </text>
  <text x="475" y="58" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">
    Cumulative Kinetic Energy Transmission · Ground Reaction Force to Ball Impact (Dr. Ben Kibler Model)
  </text>

  <!-- STAGE 1: GROUND REACTION & LEG DRIVE -->
  <rect x="40" y="100" width="180" height="95" class="stage-box" />
  <circle cx="60" cy="115" r="12" fill="#047857" />
  <text x="60" y="119" class="stage-num">1</text>
  <text x="135" y="125" class="stage-title">GROUND DRIVE</text>
  <text x="130" y="148" class="stage-sub">Deep Knee Flexion</text>
  <text x="130" y="166" class="stage-sub">Vertical Push (GRF)</text>
  <text x="130" y="184" class="energy-pct">~51% Total Force</text>

  <!-- ARROW 1 -> 2 -->
  <path d="M 220 148 L 265 148" class="arrow" />

  <!-- STAGE 2: PELVIC ROTATION -->
  <rect x="270" y="100" width="180" height="95" class="stage-box" />
  <circle cx="290" cy="115" r="12" fill="#047857" />
  <text x="290" y="119" class="stage-num">2</text>
  <text x="365" y="125" class="stage-title">PELVIC ROTATION</text>
  <text x="360" y="148" class="stage-sub">Hip Uncoiling Forward</text>
  <text x="360" y="166" class="stage-sub">Hip-Shoulder Separation</text>
  <text x="360" y="184" class="stage-sub" font-weight="700">Torque Generator</text>

  <!-- ARROW 2 -> 3 -->
  <path d="M 450 148 L 495 148" class="arrow" />

  <!-- STAGE 3: THORACIC ROTATION -->
  <rect x="500" y="100" width="180" height="95" class="stage-box" />
  <circle cx="520" cy="115" r="12" fill="#047857" />
  <text x="520" y="119" class="stage-num">3</text>
  <text x="595" y="125" class="stage-title">TORSO / TRUNK</text>
  <text x="590" y="148" class="stage-sub">Thoracic Extension</text>
  <text x="590" y="166" class="stage-sub">Lateral Cartwheel Tilt</text>
  <text x="590" y="184" class="energy-pct">+15% Added Speed</text>

  <!-- ARROW 3 -> 4 -->
  <path d="M 680 148 L 725 148" class="arrow" />

  <!-- STAGE 4: SHOULDER TILT & TROPHY POSE -->
  <rect x="730" y="100" width="180" height="95" class="stage-box" />
  <circle cx="750" cy="115" r="12" fill="#047857" />
  <text x="750" y="119" class="stage-num">4</text>
  <text x="825" y="125" class="stage-title">TROPHY POSE</text>
  <text x="820" y="148" class="stage-sub">Shoulder Alignment</text>
  <text x="820" y="166" class="stage-sub">Non-Dominant Arm High</text>
  <text x="820" y="184" class="stage-sub" font-weight="700">Elastic Pre-Stretch</text>

  <!-- CURVE ARROW DOWN: STAGE 4 -> STAGE 5 -->
  <path d="M 820 195 C 820 240, 820 240, 820 265" class="arrow" />

  <!-- ROW 2: RIGHT TO LEFT -->

  <!-- STAGE 5: RACKET DROP -->
  <rect x="730" y="270" width="180" height="95" class="stage-box" />
  <circle cx="750" cy="285" r="12" fill="#047857" />
  <text x="750" y="289" class="stage-num">5</text>
  <text x="825" y="295" class="stage-title">RACKET DROP</text>
  <text x="820" y="318" class="stage-sub">External Shoulder Rot.</text>
  <text x="820" y="336" class="stage-sub">Subconscious Elastic Lag</text>
  <text x="820" y="354" class="stage-sub" font-weight="700">Deep Tip Drop</text>

  <!-- ARROW 5 -> 6 -->
  <path d="M 730 318 L 685 318" class="arrow" />

  <!-- STAGE 6: INTERNAL SHOULDER ROTATION & PRONATION -->
  <rect x="500" y="270" width="180" height="95" class="stage-box" />
  <circle cx="520" cy="285" r="12" fill="#047857" />
  <text x="520" y="289" class="stage-num">6</text>
  <text x="595" y="295" class="stage-title">PRONATION</text>
  <text x="590" y="318" class="stage-sub">Internal Shoulder Rot.</text>
  <text x="590" y="336" class="stage-sub">Forearm Pronates Out</text>
  <text x="590" y="354" class="energy-pct">Fastest Human Joint Rot.</text>

  <!-- ARROW 6 -> 7 -->
  <path d="M 500 318 L 455 318" class="arrow" />

  <!-- STAGE 7: IMPACT POINT -->
  <rect x="270" y="270" width="180" height="95" class="stage-box" stroke="#dc2626" />
  <circle cx="290" cy="285" r="12" fill="#dc2626" />
  <text x="290" y="289" class="stage-num">7</text>
  <text x="365" y="295" class="stage-title" fill="#dc2626">BALL CONTACT</text>
  <text x="360" y="318" class="stage-sub">Maximum Reach (11:30–12)</text>
  <text x="360" y="336" class="stage-sub">Wrist Stable & Neutral</text>
  <text x="360" y="354" class="energy-pct" font-size="13">PEAK VELOCITY</text>

  <!-- ARROW 7 -> 8 -->
  <path d="M 270 318 L 225 318" class="arrow" />

  <!-- STAGE 8: DECELERATION & LANDING -->
  <rect x="40" y="270" width="180" height="95" class="stage-box" />
  <circle cx="60" cy="285" r="12" fill="#047857" />
  <text x="60" y="289" class="stage-num">8</text>
  <text x="135" y="295" class="stage-title">DECELERATION</text>
  <text x="130" y="318" class="stage-sub">Front Leg Landing Inside</text>
  <text x="130" y="336" class="stage-sub">Rotator Cuff Eccentric Catch</text>
  <text x="130" y="354" class="stage-sub" font-weight="700">Injury Prevention</text>

  <!-- SUMMARY NOTE -->
  <rect x="40" y="400" width="870" height="55" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="475" y="424" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">
    Key Biomechanical Rule: A 20% loss in ground reaction force or trunk rotation requires the shoulder to work 34% harder to achieve the same ball speed.
  </text>
  <text x="475" y="442" font-family="'DM Sans', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Power flows from the ground up — the arm acts as a delivery whip, not the primary engine.
  </text>
</svg>

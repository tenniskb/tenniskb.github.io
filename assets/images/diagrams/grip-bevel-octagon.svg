<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <style>
      .bg-oct { fill: #f8fafc; stroke: #0f172a; stroke-width: 4; }
      .bevel-text { font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
      .grip-label { font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; fill: #047857; text-anchor: middle; }
      .accent-line { stroke: #059669; stroke-width: 2; stroke-dasharray: 4,4; }
      .center-circle { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 2; }
      .legend-title { font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .legend-desc { font-family: 'DM Sans', sans-serif; font-size: 13px; fill: #475569; }
      @media (prefers-color-scheme: dark) {
        .bg-oct { fill: #1e293b; stroke: #94a3b8; }
        .bevel-text { fill: #f1f5f9; }
        .grip-label { fill: #34d399; }
        .legend-title { fill: #f1f5f9; }
        .legend-desc { fill: #cbd5e1; }
        .center-circle { fill: #334155; stroke: #64748b; }
      }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="40" font-family="'DM Sans', sans-serif" font-size="22" font-weight="800" fill="#047857" text-anchor="middle">
    TENNIS RACKET 8-BEVEL SYSTEM (RIGHT-HANDED)
  </text>
  <text x="400" y="65" font-family="'DM Sans', sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">
    Butt Cap Cross-Section View · Numbered Clockwise (Bevel 1 to 8)
  </text>

  <!-- Octagon Polygon (Center: 400, 310; Radius ~170) -->
  <polygon points="
    335,170 465,170 
    557,232 557,388 
    465,450 335,450 
    243,388 243,232" 
    class="bg-oct" />

  <!-- Center Butt Cap Logo Area -->
  <circle cx="400" cy="310" r="50" class="center-circle" />
  <text x="400" y="305" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">BUTT CAP</text>
  <text x="400" y="325" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#059669" text-anchor="middle">CENTER</text>

  <!-- BEVEL 1: TOP HORIZONTAL -->
  <text x="400" y="150" class="bevel-text">BEVEL 1</text>
  <text x="400" y="195" class="grip-label">Eastern Backhand Variant</text>

  <!-- BEVEL 2: TOP-RIGHT DIAGONAL -->
  <text x="560" y="195" class="bevel-text">BEVEL 2</text>
  <rect x="525" y="202" width="130" height="24" rx="4" fill="#d1fae5" />
  <text x="590" y="218" class="grip-label" font-weight="700" fill="#065f46">★ CONTINENTAL</text>

  <!-- BEVEL 3: RIGHT VERTICAL -->
  <text x="615" y="315" class="bevel-text">BEVEL 3</text>
  <rect x="575" y="322" width="140" height="24" rx="4" fill="#e0e7ff" />
  <text x="645" y="338" class="grip-label" font-weight="700" fill="#3730a3">EASTERN FOREHAND</text>

  <!-- BEVEL 4: BOTTOM-RIGHT DIAGONAL -->
  <text x="560" y="445" class="bevel-text">BEVEL 4</text>
  <rect x="525" y="452" width="150" height="24" rx="4" fill="#dcfce7" />
  <text x="600" y="468" class="grip-label" font-weight="700" fill="#15803d">★ SEMI-WESTERN (PRO)</text>

  <!-- BEVEL 5: BOTTOM HORIZONTAL -->
  <text x="400" y="485" class="bevel-text">BEVEL 5</text>
  <rect x="330" y="492" width="140" height="24" rx="4" fill="#fae8ff" />
  <text x="400" y="508" class="grip-label" font-weight="700" fill="#86198f">FULL WESTERN</text>

  <!-- BEVEL 6: BOTTOM-LEFT DIAGONAL -->
  <text x="210" y="445" class="bevel-text">BEVEL 6</text>
  <text x="200" y="468" class="grip-label">Hawaiian / Extreme</text>

  <!-- BEVEL 7: LEFT VERTICAL -->
  <text x="170" y="315" class="bevel-text">BEVEL 7</text>
  <text x="160" y="338" class="grip-label">Semi-Western 1HBH</text>

  <!-- BEVEL 8: TOP-LEFT DIAGONAL -->
  <text x="210" y="195" class="bevel-text">BEVEL 8</text>
  <rect x="110" y="202" width="150" height="24" rx="4" fill="#fef3c7" />
  <text x="185" y="218" class="grip-label" font-weight="700" fill="#92400e">EASTERN 1HBH</text>

  <!-- Bottom Guide Key -->
  <rect x="100" y="540" width="600" height="85" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="120" y="565" class="legend-title">How to Index Your Grip:</text>
  <text x="120" y="588" class="legend-desc">• Align the <tspan font-weight="700" fill="#047857">Base Knuckle of Index Finger</tspan> and <tspan font-weight="700" fill="#047857">Heel Pad</tspan> on the target bevel plane.</text>
  <text x="120" y="608" class="legend-desc">• Bevel 2 = Serve, Volley, Slice · Bevel 3 = Flat Drive · Bevel 4 = Modern Topspin · Bevel 8 = 1H Backhand.</text>
</svg>

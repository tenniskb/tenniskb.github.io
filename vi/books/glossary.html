<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Từ Điển Thuật Ngữ Quần Vợt — Tennis Unified</title>
<style>
  :root{
    --court-ink:#0f2438;
    --court-ink-soft:#1c3a56;
    --chalk:#f6f4ee;
    --chalk-dim:#d9d4c6;
    --line-white:#ffffff;
    --mustard:#c98a2c;
    --mustard-soft:#e7b96a;
    --hairline: rgba(15,36,56,0.14);
    --card-bg: var(--line-white);
    --page-bg: var(--chalk);
    --text-main: var(--court-ink);
    --text-dim: #52616f;
    --serif: 'Iowan Old Style', 'Palatino Linotype', Georgia, 'Times New Roman', serif;
    --grotesk: -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }
  [data-theme="dark"]{
    --court-ink:#eef3f7;
    --court-ink-soft:#c7d6e2;
    --chalk:#0b1620;
    --chalk-dim:#33424e;
    --line-white:#101d29;
    --mustard:#e7b455;
    --mustard-soft:#a9752a;
    --hairline: rgba(238,243,247,0.14);
    --card-bg: #101d29;
    --page-bg: #0b1620;
    --text-main: #eef3f7;
    --text-dim: #93a4b2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--page-bg);
    color: var(--text-main);
    font-family: var(--grotesk);
    line-height:1.5;
    transition: background .25s ease, color .25s ease;
  }
  a{color:inherit;}

  .court-lines{
    position:sticky; top:0; z-index:20;
    background: var(--court-ink);
    color: var(--chalk);
    border-bottom: 3px solid var(--mustard);
  }
  .court-lines-inner{
    max-width:1040px; margin:0 auto; padding:18px 24px 16px;
    display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .brand{
    font-family: var(--serif);
    font-size: 1.5rem;
    letter-spacing:.2px;
  }
  .brand small{
    display:block; font-family: var(--grotesk); font-size:.72rem;
    color: var(--mustard-soft); text-transform:none; margin-top:2px; letter-spacing:.3px;
  }
  .theme-toggle{
    background:transparent; border:1px solid rgba(246,244,238,0.35);
    color:var(--chalk); border-radius:999px; padding:6px 14px; font-size:.82rem;
    cursor:pointer; font-family: var(--grotesk);
  }
  .theme-toggle:hover{ border-color: var(--mustard); }

  .toolbar{
    max-width:1040px; margin:0 auto; padding:20px 24px 0;
  }
  .search-row{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  #search{
    flex:1 1 260px;
    font-family: var(--serif);
    font-size:1.15rem;
    padding:12px 16px;
    border:1px solid var(--hairline);
    border-radius:10px;
    background: var(--card-bg);
    color: var(--text-main);
  }
  #search:focus{ outline:2px solid var(--mustard); outline-offset:1px; }
  .count-pill{
    font-family: var(--mono); font-size:.78rem; color:var(--text-dim);
    white-space:nowrap;
  }
  .chips{
    display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 4px;
  }
  .chip{
    font-size:.82rem; padding:6px 12px; border-radius:999px;
    border:1px solid var(--hairline); background:transparent; color:var(--text-main);
    cursor:pointer; font-family: var(--grotesk);
  }
  .chip[aria-pressed="true"]{
    background: var(--mustard); border-color: var(--mustard); color: var(--court-ink);
    font-weight:600;
  }

  main{ max-width:1040px; margin:0 auto; padding:20px 24px 80px; }
  .category-block{ margin-top:34px; }
  .category-title{
    font-family: var(--serif); font-size:1.05rem; font-weight:600;
    padding-bottom:6px; border-bottom:1px solid var(--hairline);
    color: var(--court-ink-soft);
  }
  [data-theme="dark"] .category-title{ color: var(--court-ink); }

  .term-card{
    padding:16px 0; border-bottom:1px solid var(--hairline);
    display:grid; grid-template-columns: 1fr; gap:6px;
  }
  .term-head{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  }
  .term-vi{
    font-family: var(--serif); font-size:1.18rem; font-weight:600;
  }
  .term-en{
    font-family: var(--mono); font-size:.78rem; color: var(--text-dim);
  }
  .term-note{ font-size:.94rem; color: var(--text-dim); max-width:70ch; }
  .term-variants{
    font-size:.82rem; color: var(--text-dim);
  }
  .term-variants em{ font-style:normal; color: var(--text-main); border-bottom:1px dotted var(--hairline); }

  .empty-state{
    padding:60px 0; text-align:center; color:var(--text-dim); font-family: var(--serif); font-size:1.1rem;
  }

  @media (max-width:600px){
    .court-lines-inner{ padding:14px 16px; }
    .toolbar, main{ padding-left:16px; padding-right:16px; }
  }
</style>
</head>
<body data-theme="light">

  <header class="court-lines">
    <div class="court-lines-inner">
      <div class="brand">
        <a href="index.html" style="text-decoration:none; color:inherit;">Từ Điển Thuật Ngữ Quần Vợt</a>
        <small>Tennis Unified Vietnamese Digital Library — Nguồn thuật ngữ chuẩn hóa</small>
      </div>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <a href="index.html" style="text-decoration:none; font-size:0.85rem; color:var(--chalk); padding:6px 14px; border:1px solid rgba(246,244,238,0.3); border-radius:999px;">← Về Thư Viện Sách</a>
        <a href="court_diagrams.html" style="text-decoration:none; font-size:0.85rem; color:var(--mustard-soft); padding:6px 14px; border:1px solid rgba(201,138,44,0.4); border-radius:999px;">🎯 Sơ Đồ Chiến Thuật</a>
        <button class="theme-toggle" id="themeToggle" type="button">Chế độ tối</button>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-row">
      <input id="search" type="text" placeholder="Tìm theo tiếng Việt hoặc tiếng Anh — ví dụ: “xoay trong khớp vai”, “kick serve”…" autocomplete="off">
      <span class="count-pill" id="countPill"></span>
    </div>
    <div class="chips" id="categoryChips" role="group" aria-label="Lọc theo chủ đề"></div>
  </div>

  <main id="results"></main>

  <script>
    // Đường dẫn tới tệp nguồn chuẩn. Đặt tennis_glossary_vi.json cùng thư mục với
    // glossary.html, hoặc sửa đường dẫn dưới đây cho khớp với cấu trúc repo thực tế.
    const GLOSSARY_JSON_PATH = './tennis_glossary_vi.json';

    const CATEGORY_LABELS = {
      biomechanics: 'Sinh Cơ Học',
      strokes: 'Kỹ Thuật Cú Đánh',
      tactics: 'Chiến Thuật',
      doubles: 'Đánh Đôi',
      footwork_movement: 'Di Chuyển & Bước Chân',
      mental_psychology: 'Tâm Lý Thi Đấu',
      training_conditioning: 'Huấn Luyện & Thể Lực',
      equipment_scoring: 'Dụng Cụ & Luật Tính Điểm'
    };

    let ALL_TERMS = [];
    let activeCategory = 'all';

    const resultsEl = document.getElementById('results');
    const searchEl = document.getElementById('search');
    const chipsEl = document.getElementById('categoryChips');
    const countEl = document.getElementById('countPill');

    function norm(s){
      return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    }

    function buildChips(){
      const cats = ['all', ...Object.keys(CATEGORY_LABELS).filter(c => ALL_TERMS.some(t => t.category === c))];
      chipsEl.innerHTML = '';
      cats.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.type = 'button';
        btn.textContent = c === 'all' ? 'Tất cả' : CATEGORY_LABELS[c];
        btn.setAttribute('aria-pressed', c === activeCategory ? 'true' : 'false');
        btn.addEventListener('click', () => {
          activeCategory = c;
          [...chipsEl.children].forEach(ch => ch.setAttribute('aria-pressed', 'false'));
          btn.setAttribute('aria-pressed', 'true');
          render();
        });
        chipsEl.appendChild(btn);
      });
    }

    function matches(term, q){
      if (!q) return true;
      const hay = norm([
        term.term_vi_standard, term.term_en, term.note,
        ...(term.variants_to_replace || [])
      ].join(' '));
      return hay.includes(norm(q));
    }

    function render(){
      const q = searchEl.value.trim();
      const filtered = ALL_TERMS.filter(t =>
        (activeCategory === 'all' || t.category === activeCategory) && matches(t, q)
      );

      countEl.textContent = filtered.length + ' / ' + ALL_TERMS.length + ' thuật ngữ';

      if (!filtered.length){
        resultsEl.innerHTML = '<div class="empty-state">Không tìm thấy thuật ngữ phù hợp. Thử một từ khóa khác.</div>';
        return;
      }

      const byCategory = {};
      filtered.forEach(t => {
        (byCategory[t.category] = byCategory[t.category] || []).push(t);
      });

      const order = Object.keys(CATEGORY_LABELS).filter(c => byCategory[c]);
      resultsEl.innerHTML = order.map(cat => `
        <section class="category-block">
          <h2 class="category-title">${CATEGORY_LABELS[cat]}</h2>
          ${byCategory[cat]
            .sort((a,b) => a.term_vi_standard.localeCompare(b.term_vi_standard, 'vi'))
            .map(t => `
              <article class="term-card">
                <div class="term-head">
                  <span class="term-vi">${t.term_vi_standard}</span>
                  <span class="term-en">${t.term_en}</span>
                </div>
                ${t.note ? `<div class="term-note">${t.note}</div>` : ''}
                ${(t.variants_to_replace && t.variants_to_replace.length)
                  ? `<div class="term-variants">Thay thế cho: ${t.variants_to_replace.map(v => `<em>${v}</em>`).join(', ')}</div>`
                  : ''}
              </article>
            `).join('')}
        </section>
      `).join('');
    }

    searchEl.addEventListener('input', render);

    document.getElementById('themeToggle').addEventListener('click', () => {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('themeToggle').textContent = isDark ? 'Chế độ tối' : 'Chế độ sáng';
    });

        const EMBEDDED_TERMS = [{"id": "kinetic_chain", "term_en": "Kinetic Chain", "term_vi_standard": "Chuỗi động học liên hoàn", "variants_to_replace": ["chuỗi động lực", "dây chuyền động lực", "chuỗi vận động"], "category": "biomechanics", "note": "Trình tự truyền lực từ chân → hông → thân → vai → tay → vợt."}, {"id": "pronation", "term_en": "Pronation", "term_vi_standard": "Động tác sấp cổ tay / xoay trong cẳng tay", "variants_to_replace": ["gập cổ tay", "sấp tay"], "category": "biomechanics", "note": "Xoay xương quay quanh xương trụ, thường thấy ở pha tiếp xúc bóng của cú giao bóng và forehand hiện đại."}, {"id": "internal_shoulder_rotation", "term_en": "Internal Shoulder Rotation", "term_vi_standard": "Xoay trong khớp vai", "variants_to_replace": ["xoay vai vào trong", "vặn vai trong"], "category": "biomechanics", "note": "Chuyển động chính tạo tốc độ đầu vợt trong pha tăng tốc của cú giao bóng."}, {"id": "external_shoulder_rotation", "term_en": "External Shoulder Rotation", "term_vi_standard": "Xoay ngoài khớp vai", "variants_to_replace": ["xoay vai ra ngoài"], "category": "biomechanics", "note": "Giai đoạn 'lên dây cót' (loading) trước khi xoay trong khớp vai."}, {"id": "split_step", "term_en": "Split-step", "term_vi_standard": "Bước nhún tách chân chuẩn bị", "variants_to_replace": ["bước nhảy tách", "bước chuẩn bị nhảy"], "category": "footwork_movement", "note": "Động tác nhún nhẹ hai chân ngay trước khi đối thủ tiếp xúc bóng."}, {"id": "unit_turn", "term_en": "Unit Turn", "term_vi_standard": "Xoay nguyên khối thân trên", "variants_to_replace": ["xoay đơn vị", "xoay khối người"], "category": "biomechanics", "note": "Vai, hông và chân xoay đồng bộ như một khối ngay khi nhận diện hướng bóng."}, {"id": "kinetic_energy_transfer", "term_en": "Energy Transfer / Summation of Speed", "term_vi_standard": "Cộng dồn tốc độ theo chuỗi", "variants_to_replace": ["cộng lực tuần tự"], "category": "biomechanics", "note": "Nguyên lý mỗi khớp truyền và khuếch đại tốc độ cho khớp tiếp theo trong chuỗi động học."}, {"id": "ground_reaction_force", "term_en": "Ground Reaction Force (GRF)", "term_vi_standard": "Lực phản lực từ mặt đất", "variants_to_replace": ["phản lực nền", "lực đẩy từ sàn"], "category": "biomechanics", "note": "Lực mặt sân tác động ngược lại cơ thể khi đạp chân, là nguồn lực khởi phát của chuỗi động học."}, {"id": "kinetic_loading", "term_en": "Loading Phase", "term_vi_standard": "Giai đoạn nạp lực", "variants_to_replace": ["giai đoạn dồn lực", "pha tích lũy năng lượng"], "category": "biomechanics", "note": "Giai đoạn dồn trọng tâm và kéo giãn cơ trước khi bung lực (ví dụ: gối khuỵu trước khi bật nhảy giao bóng)."}, {"id": "fascia_sling_system", "term_en": "Fascia / Sling System", "term_vi_standard": "Hệ thống dây chằng chéo cân mạc", "variants_to_replace": ["hệ thống sling cơ", "chuỗi cơ chéo"], "category": "biomechanics", "note": "Mạng lưới cân mạc kết nối các nhóm cơ chéo (ví dụ: sling sau chéo vai-hông đối diện) hỗ trợ truyền lực xoay."}, {"id": "contact_point", "term_en": "Contact Point", "term_vi_standard": "Điểm tiếp xúc bóng", "variants_to_replace": ["điểm chạm bóng", "điểm va chạm"], "category": "strokes", "note": "Vị trí không gian nơi mặt vợt gặp bóng."}, {"id": "strike_zone", "term_en": "Strike Zone", "term_vi_standard": "Vùng đánh bóng lý tưởng", "variants_to_replace": ["vùng đánh tối ưu"], "category": "strokes", "note": "Khoảng không gian (chiều cao, khoảng cách) mà người chơi tạo lực và kiểm soát tốt nhất."}, {"id": "kinetic_wiper_finish", "term_en": "Windshield Wiper Finish", "term_vi_standard": "Kết thúc kiểu cần gạt nước", "variants_to_replace": ["vung vợt kiểu gạt mưa", "kết thúc xoay tròn"], "category": "strokes", "note": "Kiểu kết thúc cú forehand hiện đại, cánh tay quét vòng cung tạo topspin cao."}, {"id": "open_stance", "term_en": "Open Stance", "term_vi_standard": "Tư thế đứng mở", "variants_to_replace": ["thế đứng mở người", "đứng ngang mở"], "category": "strokes", "note": "Hai vai và hông song s
